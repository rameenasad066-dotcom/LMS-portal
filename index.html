<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>(function(){try{var t=localStorage.getItem('swr_theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<title>Study With Rameen · LMS Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="gateway-body">

  <button class="icon-btn theme-toggle floating" type="button" data-theme-toggle aria-label="Switch between light and dark theme">
    <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-7.54-7.54c-.44-.06-.9-.1-1.36-.1z"/></svg>
    <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/></svg>
  </button>

  <main class="gateway-card">
    <img src="logo.png" class="logo" alt="Study With Rameen">

    <h1>Study With Rameen</h1>
    <p class="gw-sub" aria-label="O Level · IGCSE — Pakistan Studies & Islamiyat. Learning Management Portal.">
      <span aria-hidden="true">O Level · IGCSE — <span class="gw-type" id="gwType"></span><span class="gw-caret" id="gwCaret"></span></span>
      <span class="gw-line2" id="gwLine2" aria-hidden="true">Learning Management Portal</span>
    </p>

    <div class="gw-actions">
      <a class="btn btn-primary btn-block" href="teacher-login.html">Teacher Portal</a>
      <a class="btn btn-outline btn-block" href="login.html">Student Portal</a>
    </div>

    <p class="gw-foot">© 2026 Study With Rameen</p>
  </main>

<script src="owl.js"></script>
<script src="theme.js"></script>
<script>
(function () {
  const TEXT = 'Pakistan Studies & Islamiyat';
  const typeEl = document.getElementById('gwType');
  const caret = document.getElementById('gwCaret');
  const line2 = document.getElementById('gwLine2');
  const done = () => {
    line2.classList.add('show');
    setTimeout(() => caret.classList.add('done'), 1300);
  };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    typeEl.textContent = TEXT;
    done();
    return;
  }
  let i = 0;
  setTimeout(function tick() {
    typeEl.textContent = TEXT.slice(0, ++i);
    if (i < TEXT.length) setTimeout(tick, 42);
    else done();
  }, 650);
})();
</script>
</body>
</html>
