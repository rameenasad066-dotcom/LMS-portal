<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password · Study With Rameen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="gateway-body">

  <main class="gateway-card auth-card">
    <img src="logo.png" class="logo" alt="Study With Rameen">
    <h1>Set New Password</h1>
    <p class="gw-sub" id="upIntro">Checking your reset link…</p>

    <form class="settings-form auth-form" id="updateForm" hidden>
      <label for="upPassword">New password</label>
      <input type="password" id="upPassword" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
      <p class="auth-error" id="upError" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">Update Password</button>
    </form>

    <p class="gw-foot"><a href="index.html">← Back to gateway</a></p>
  </main>

<script type="module" src="update-password.js"></script>
</body>
</html>
